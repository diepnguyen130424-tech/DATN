spring.application.name=bangiay
server.port=8080

# Supabase PostgreSQL - Session Pooler
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.cvcrqlveszvopncupzib
spring.datasource.password=Evl@2024#Secure
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Hibernate - tối ưu truy vấn và batch
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.generate_statistics=false

# HikariCP - quản lý kết nối database
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=0

# JDBC - chuẩn bị statement
spring.datasource.hikari.data-source-properties.prepareThreshold=3

# Upload ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Hiển thị thông báo lỗi
spring.web.error.include-message=always