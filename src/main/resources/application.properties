spring.application.name=bangiay
server.port=8080

# Supabase PostgreSQL - Session Pooler
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.cvcrqlveszvopncupzib
spring.datasource.password=Evl@2024#Secure
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Tắt show-sql và format-sql để không in log SQL rác ra màn hình (giúp tăng tốc độ)
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Tối ưu Hibernate cho phép gộp lệnh (tăng tốc insert/update)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP - Tối ưu cho mạng có độ trễ (Supabase)
# Tăng pool size lên 10 để chịu tải
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
# Max lifetime 15 phút để tránh bị Supabase tự ngắt kết nối
spring.datasource.hikari.max-lifetime=900000
# Giữ kết nối luôn hoạt động (ping mỗi 60 giây)
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Upload ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Hiển thị thông báo lỗi
spring.web.error.include-message=always

